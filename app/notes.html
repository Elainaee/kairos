<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kairos Notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="schedule-feature.css?v=30">
  <link rel="stylesheet" href="settings-feature.css?v=1">
  <style>
    body{margin:0;background:#f9f7f0;color:#2f2b24;font-family:Outfit,system-ui,sans-serif}
    .notes-shell{padding:112px 32px 120px;min-height:100vh}
    .notes-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 auto 24px;max-width:1180px}
    .notes-kicker{display:block;color:#a35638;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    .notes-head h1{margin:6px 0 6px;font-size:42px;line-height:1.05}
    .notes-head p{margin:0;color:#6f6a5f;font-size:15px}
    .notes-primary{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:18px;background:#2f4432;color:#fff;padding:12px 18px;font-weight:800;cursor:pointer;box-shadow:0 16px 34px rgba(47,68,50,.18)}
    .notes-layout{display:grid;grid-template-columns:minmax(0,1.35fr) 340px;gap:22px;margin:0 auto;max-width:1180px}
    .notes-panel,.notes-side{border:1px solid rgba(91,75,58,.16);border-radius:24px;background:rgba(255,253,246,.82);box-shadow:0 24px 70px rgba(75,61,44,.08);backdrop-filter:blur(18px)}
    .notes-toolbar{display:grid;grid-template-columns:1fr 180px;gap:12px;padding:18px;border-bottom:1px solid rgba(91,75,58,.12)}
    .notes-toolbar input{border:1px solid rgba(91,75,58,.18);border-radius:16px;background:#fffdf7;padding:11px 13px;font:700 13px/1.2 Outfit;color:#2f2b24}
    .notes-list{display:grid;gap:12px;padding:18px}
    .note-card{display:grid;grid-template-columns:1fr auto;gap:16px;border:1px solid rgba(91,75,58,.13);border-radius:18px;background:#fffaf0;padding:16px;text-align:left;color:inherit;transition:transform .16s ease,border-color .16s ease}
    .note-card:hover{transform:translateY(-2px);border-color:rgba(163,86,56,.35)}
    .note-open{display:block;border:0;background:transparent;padding:0;text-align:left;color:inherit;cursor:pointer}
    .note-card h3{margin:0 0 6px;font-size:18px}
    .note-card p{margin:0;color:#6b6257;font-size:13px;line-height:1.45}
    .note-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;color:#8a6b55;font-size:12px;font-weight:800}
    .note-meta span{border-radius:999px;background:#efe7d4;padding:5px 8px}
    .note-actions{display:flex;gap:8px}
    .note-actions button{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:12px;background:transparent;color:#6b6257;cursor:pointer}
    .note-actions button:hover{background:#efe7d4}
    .notes-empty{padding:38px;text-align:center;color:#7b7164}
    .notes-side{padding:18px}
    .notes-side h2{margin:0 0 14px;font-size:18px}
    .mood-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .mood-grid button{border:1px solid rgba(91,75,58,.14);border-radius:15px;background:#fffdf7;padding:10px;text-align:left;font-weight:800;color:#4d463b;cursor:pointer}
    .mood-grid button.active{border-color:#3f6b4a;background:#e8f1df;color:#2f4432}
    .note-dialog{width:min(620px,calc(100vw - 28px));border:0;border-radius:24px;background:#fffdf7;color:#2f2b24;padding:0;box-shadow:0 34px 120px rgba(44,34,24,.28)}
    .note-dialog::backdrop{background:rgba(47,37,30,.28);backdrop-filter:blur(4px)}
    .note-form{display:grid;gap:14px;padding:22px}
    .note-form header,.note-form footer{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .note-form h2{margin:0;font-size:24px}
    .note-form label{display:grid;gap:7px;font-size:12px;font-weight:800;color:#71685e}
    .note-form input,.note-form textarea,.note-form select{border:1px solid rgba(91,75,58,.17);border-radius:14px;background:#fff;padding:11px 12px;color:#2f2b24;font:700 13px/1.35 Outfit}
    .note-form textarea{min-height:150px;resize:vertical}
    .note-attachment-field{gap:10px!important}.note-attachment-row{display:flex;align-items:center;gap:10px}.note-attachment-pick{display:inline-flex;align-items:center;gap:7px;width:max-content;border:1px solid rgba(91,75,58,.16);border-radius:14px;background:#eee5d3;padding:9px 12px;color:#3f362b;font-weight:850;cursor:pointer}.note-attachment-pick input{position:absolute;inline-size:1px;block-size:1px;opacity:0;pointer-events:none}.note-attachment-hint{color:#8a8174;font-size:11px;font-weight:700}.note-attachment-list{display:grid;gap:8px}.note-attachment-chip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:9px;border:1px solid rgba(91,75,58,.13);border-radius:14px;background:#fff8ec;padding:8px 9px}.note-attachment-chip img{width:34px;height:34px;border-radius:10px;object-fit:cover;background:#efe7d4}.note-attachment-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#efe7d4;color:#6d604f}.note-attachment-chip strong,.note-attachment-chip small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note-attachment-chip strong{font-size:12px;color:#3f362b}.note-attachment-chip small{margin-top:2px;color:#8a8174;font-size:10px}.note-attachment-chip button{display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:10px;background:transparent;color:#8a4b35;cursor:pointer}.note-attachment-chip button:hover{background:#ffe1d7}
    .note-form footer button,.note-close{border:0;border-radius:14px;background:#eee5d3;padding:10px 14px;font-weight:800;cursor:pointer}
    .note-form footer .danger{background:#ffe1d7;color:#9e3d19}
    .note-form footer .primary{background:#2f4432;color:#fff}
    @media(max-width:860px){.notes-shell{padding:96px 18px}.notes-head{align-items:flex-start;flex-direction:column}.notes-layout{grid-template-columns:1fr}.notes-toolbar{grid-template-columns:1fr}.notes-head h1{font-size:34px}}
  </style>
</head>
<body data-page="notes">
  <main class="notes-shell kairos-page-main">
    <header class="notes-head">
      <div><span class="notes-kicker">Journal</span><h1>Notes & Mood</h1><p>Capture study notes, daily reflections, and small emotional weather.</p></div>
      <button class="notes-primary" data-note-add type="button"><span class="material-symbols-outlined">edit_note</span>Add Note</button>
    </header>
    <section class="notes-layout">
      <div class="notes-panel">
        <div class="notes-toolbar">
          <input data-note-search placeholder="Search notes, tags, or text" aria-label="Search notes">
          <input data-note-date type="date" aria-label="Filter notes by date">
        </div>
        <div class="notes-list" data-note-list></div>
      </div>
      <aside class="notes-side">
        <h2>Today's Mood</h2>
        <div class="mood-grid" data-mood-grid></div>
      </aside>
    </section>
  </main>
  <dialog class="note-dialog" id="noteEditor">
    <form class="note-form" method="dialog">
      <header><h2 data-note-dialog-title>Add Note</h2><button class="note-close" data-note-cancel type="button" aria-label="Close">×</button></header>
      <label>Title<input name="title" maxlength="80" required></label>
      <label>Date<input name="date" type="date" required></label>
      <label>Mood<select name="mood"></select></label>
      <label>Tags<input name="tags" placeholder="study, reading"></label>
      <label>Linked schedule IDs<input name="linkedScheduleIds" placeholder="Optional IDs separated by comma"></label>
      <label class="note-attachment-field">Attachments
        <span class="note-attachment-row"><span class="note-attachment-pick"><span class="material-symbols-outlined">attach_file</span>Add files<input data-note-attachments name="attachments" type="file" multiple accept="image/*,.pdf,.txt,.md,.doc,.docx"></span><span class="note-attachment-hint">Images keep a small preview locally.</span></span>
        <span class="note-attachment-list" data-note-attachment-list></span>
      </label>
      <label>Note<textarea name="text" placeholder="What happened? What did you learn?"></textarea></label>
      <footer><button class="danger" data-note-delete type="button">Delete</button><span></span><button data-note-cancel type="button">Cancel</button><button class="primary" type="submit">Save</button></footer>
    </form>
  </dialog>
  <script src="note-core.cjs?v=1"></script>
  <script src="notes-feature.js?v=1"></script>
  <script src="stitch-shell.js?v=81"></script>
  <script src="settings-feature.js?v=1"></script>
  <script src="reminder-core.cjs?v=1"></script>
  <script src="reminder-feature.js?v=7"></script>
</body>
</html>
