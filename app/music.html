<style>
:root {
  --sidebar-width: 15rem;
  --sidebar-bg: #f5f4ed;
  --sidebar-fg: #3D3B2E;
  --sidebar-muted: #676556;
  --sidebar-accent: rgba(209,99,60,.12);
  --sidebar-accent-fg: #D1633C;
  --sidebar-border: rgba(61,59,46,.1);
}

body {
  background: #F9F7F0;
  color: #1b1c18;
  font-family: Outfit, system-ui, sans-serif;
  overflow: hidden;
  padding-bottom: 80px;
}

/* Wrapper */
.music-root { display: flex; height: 100vh; width: 100%; }

/* Sidebar group */
.music-sidebar-group { display: none; }
@media (min-width: 768px) { .music-sidebar-group { display: block; } }

.music-sidebar-spacer {
  width: var(--sidebar-width);
  background: transparent;
  transition: width .22s cubic-bezier(.2,.8,.2,1);
}
[data-state="collapsed"] .music-sidebar-spacer { width: 0; }

.music-sidebar-panel {
  position: fixed; inset: 0 auto 0 0; z-index: 10;
  display: flex; width: var(--sidebar-width); height: 100vh;
  transition: left .22s cubic-bezier(.2,.8,.2,1);
}
[data-state="collapsed"] .music-sidebar-panel { left: calc(var(--sidebar-width) * -1); }

.music-sidebar {
  display: flex; flex-direction: column; width: 100%; height: 100%;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
}

/* Sidebar header */
.music-sidebar-header {
  display: flex; align-items: center; gap: 8px;
  padding: 14px; min-height: 52px;
  border-bottom: 1px solid var(--sidebar-border);
}
.music-sidebar-brand {
  font-weight: 700; font-size: 15px; color: var(--sidebar-accent-fg);
  display: flex; align-items: center; gap: 8px;
}

/* Sidebar content */
.music-sidebar-content {
  flex: 1; display: flex; flex-direction: column; gap: 2px;
  padding: 8px; overflow-y: auto; overflow-x: hidden;
}
.music-group-label {
  padding: 8px 10px 4px;
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .1em; color: var(--sidebar-muted);
}
.music-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; height: 36px; padding: 0 10px;
  border: 0; border-radius: 8px;
  background: transparent; color: var(--sidebar-fg);
  font: 600 13px/1 Outfit, system-ui, sans-serif;
  cursor: pointer; white-space: nowrap;
  transition: background .16s, color .16s;
}
.music-item:hover { background: rgba(27,28,24,.06); }
.music-item[aria-checked="true"] { background: var(--sidebar-accent); color: var(--sidebar-accent-fg); }

/* Submenu */
.music-submenu-trigger { position: relative; padding-right: 28px; }
.music-submenu-chevron {
  position: absolute; right: 10px; top: 50%; translate: 0 -50%;
  font-size: 14px;
  transition: transform .2s ease;
  color: var(--sidebar-muted);
}
.music-submenu[data-state="open"] .music-submenu-chevron { transform: rotate(90deg); }
.music-submenu-list {
  overflow: hidden;
  max-height: 0;
  transition: max-height .3s cubic-bezier(.2,.8,.2,1);
}
.music-submenu[data-state="open"] .music-submenu-list {
  max-height: 120px;
}
.music-sub-item {
  padding-left: 38px;
  font-weight: 500;
}

/* Sidebar footer */
.music-sidebar-footer {
  padding: 8px; border-top: 1px solid var(--sidebar-border);
}
.music-sidebar-footer .music-item { color: var(--sidebar-muted); font-weight: 500; }

/* Sidebar rail */
.music-sidebar-rail {
  position: absolute; inset: 0 0 0 auto;
  width: 8px; translate: 50% 0; cursor: col-resize;
}
.music-sidebar-rail::after {
  content: ""; position: absolute;
  inset: 0 0 0 50%; width: 2px;
  transition: background .16s;
}
.music-sidebar-rail:hover::after { background: var(--sidebar-border); }

/* Main */
.music-main {
  position: relative; flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  background: #fbf9f2;
}
.music-trigger {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border: 0; border-radius: 6px;
  background: transparent; color: var(--sidebar-fg);
  cursor: pointer; margin: 12px 0 0 12px;
  font-size: 16px; transition: background .16s;
}
.music-trigger:hover { background: rgba(27,28,24,.06); }
.music-main-body {
  flex: 1; display: block;
  padding: 28px 36px 128px; color: var(--sidebar-muted);
  overflow: auto;
}
.music-placeholder { text-align: center; margin-top: min(22vh, 180px); }
.music-placeholder h2 { font-size: 20px; font-weight: 650; color: var(--sidebar-fg); margin: 0 0 6px; }
.music-placeholder p { font-size: 13px; margin: 0; }
.music-view[hidden]{display:none!important}
.music-view-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.music-view-title{margin:0;color:var(--sidebar-fg);font-size:22px;line-height:1.2;font-weight:750}
.music-view-subtitle{margin:5px 0 0;color:var(--sidebar-muted);font-size:13px}
.music-import-button{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:0;border-radius:9px;background:var(--primary,#d1633c);color:var(--primary-foreground,#fff);font:700 13px/1 Outfit,system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 18px color-mix(in srgb,var(--primary,#d1633c) 24%,transparent);transition:transform .16s ease,opacity .16s ease}
.music-import-button:hover{background:var(--primary,#d1633c)!important;color:var(--primary-foreground,#fff)!important;transform:translateY(-1px);opacity:.92}
.music-import-button:active{transform:translateY(0)}
.local-playlist-card{max-width:960px;border:0;background:transparent;box-shadow:none;overflow:visible}
.local-playlist-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,220px));gap:18px;align-items:start;overflow:visible;padding:2px 2px 18px}
.local-playlist-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border-bottom:1px solid rgba(61,59,46,.08)}
.local-playlist-row:last-child{border-bottom:0}
.local-playlist-row:hover{background:rgba(27,28,24,.035)}
.local-playlist-cover{width:38px;height:38px;border-radius:8px;overflow:hidden;display:grid;place-items:center;background:#ECE7D9;color:#676556;border:1px solid rgba(61,59,46,.08)}
.local-playlist-cover img{width:100%;height:100%;object-fit:cover}
.local-playlist-main{min-width:0}
.local-playlist-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sidebar-fg);font-size:14px;font-weight:750}
.local-playlist-meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px;color:var(--sidebar-muted);font-size:12px;font-weight:600}
.local-playlist-format{color:var(--sidebar-muted);font-size:11px;font-weight:700}
.local-playlist-empty{padding:28px 18px;color:var(--sidebar-muted);font-size:13px;text-align:center}
.music-status-line{min-height:18px;margin-top:12px;color:var(--sidebar-muted);font-size:12px;font-weight:600}
.playlist-tilted-card{position:relative;width:100%;height:220px;perspective:800px;border:0;background:transparent;padding:0;text-align:left;cursor:pointer}
.playlist-tilted-inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .18s ease,box-shadow .18s ease;border-radius:13px;background:#d8d4c9;box-shadow:0 14px 34px rgba(61,59,46,.12);overflow:hidden}
.playlist-tilted-card:hover .playlist-tilted-inner{box-shadow:0 20px 44px rgba(61,59,46,.18)}
.playlist-card-cover{position:absolute;inset:0;background:#ECE7D9;overflow:hidden}
.playlist-card-cover img{width:100%;height:100%;object-fit:cover;display:block}
.playlist-card-cover-placeholder{width:100%;height:100%;display:grid;place-items:center;color:rgba(255,255,255,.78);background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.22),transparent 30%),linear-gradient(135deg,#1b1c18,#68645a)}
.playlist-card-cover-placeholder .material-symbols-outlined{font-size:58px;width:auto;opacity:.72}
.playlist-card-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.18),transparent 36%,rgba(0,0,0,.16));pointer-events:none}
.playlist-card-info{position:absolute;top:22px;left:28px;max-width:calc(100% - 56px);padding:10px 16px;border-radius:12px;background:rgba(86,86,86,.64);backdrop-filter:blur(10px);transform:translateZ(30px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.playlist-card-title{display:block;margin:0;color:#fff;font-size:14px;line-height:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.playlist-card-meta{display:none}
.playlist-card-badge{position:absolute;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.78);color:var(--sidebar-fg);font-size:11px;font-weight:800;backdrop-filter:blur(8px)}
.playlist-detail{max-width:980px}
.playlist-detail-back{display:inline-flex;align-items:center;gap:6px;height:32px;margin-bottom:18px;padding:0 10px;border:0;border-radius:8px;background:rgba(27,28,24,.06);color:var(--sidebar-fg);font:700 12px/1 Outfit,system-ui,sans-serif;cursor:pointer}
.playlist-detail-back:hover{background:rgba(27,28,24,.1)}
.playlist-detail-hero{display:grid;grid-template-columns:168px minmax(0,1fr);gap:24px;align-items:end;margin-bottom:26px}
.playlist-detail-cover{width:168px;height:168px;border-radius:13px;overflow:hidden;background:#ECE7D9;box-shadow:0 16px 34px rgba(61,59,46,.12)}
.playlist-detail-cover img{width:100%;height:100%;object-fit:cover}
.playlist-detail-cover-placeholder{width:100%;height:100%;display:grid;place-items:center;color:rgba(255,255,255,.78);background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.22),transparent 30%),linear-gradient(135deg,#1b1c18,#68645a)}
.playlist-detail-cover-placeholder .material-symbols-outlined{font-size:54px;width:auto;opacity:.74}
.playlist-detail-kicker{margin:0 0 6px;color:var(--sidebar-muted);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.playlist-detail-title{margin:0;color:var(--sidebar-fg);font-size:28px;line-height:1.1;font-weight:850}
.playlist-detail-meta{margin:10px 0 0;color:var(--sidebar-muted);font-size:13px;font-weight:600}
.playlist-detail-actions{display:flex;align-items:center;gap:10px;margin-top:22px}
.playlist-play-all{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border:0;border-radius:9px;background:#ff4761;color:#fff;font:800 13px/1 Outfit,system-ui,sans-serif;cursor:pointer;box-shadow:0 10px 22px rgba(255,71,97,.2)}
.playlist-play-all:hover{transform:translateY(-1px)}
.playlist-delete{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border:1px solid rgba(61,59,46,.14);border-radius:9px;background:transparent;color:var(--sidebar-muted);font:800 13px/1 Outfit,system-ui,sans-serif;cursor:pointer;transition:background .16s,color .16s}.playlist-delete:hover{background:rgba(186,26,26,.08);color:#ba1a1a}
.playlist-detail-tabs{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:10px;border-bottom:1px solid rgba(61,59,46,.08)}
.playlist-detail-tab{position:relative;height:38px;display:inline-flex;align-items:center;color:var(--sidebar-fg);font-size:14px;font-weight:850}
.playlist-detail-tab::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:#ff4761}
.playlist-input-group{display:flex;align-items:center;width:260px;height:34px;border:0;border-radius:0;background:transparent;color:var(--sidebar-muted);box-shadow:none}
.playlist-input-group:focus-within{box-shadow:none}
.playlist-input-addon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:100%;color:var(--sidebar-muted);flex:0 0 32px}
.playlist-input-addon .material-symbols-outlined{font-size:16px;width:16px}
.playlist-input-group input{min-width:0;flex:1;height:100%;border:1px solid rgba(61,59,46,.26);border-radius:999px;outline:0;background:rgba(255,255,255,.86);padding:0 14px;color:var(--sidebar-fg);font:500 14px/1 Outfit,system-ui,sans-serif;box-shadow:0 1px 2px rgba(61,59,46,.04);transition:border-color .16s ease,box-shadow .16s ease}
.playlist-input-group input:focus{border-color:rgba(27,28,24,.36);box-shadow:0 0 0 3px rgba(27,28,24,.06)}
.playlist-input-group input::placeholder{color:#6f6a5f}
.playlist-input-results{display:inline-flex;align-items:center;align-self:stretch;padding:0 10px;color:#6f6a5f;font-size:13px;font-weight:650;white-space:nowrap}
.playlist-detail-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
.playlist-detail-table th{height:38px;padding:0 10px;text-align:left;color:var(--sidebar-muted);font-weight:650;border-bottom:1px solid rgba(61,59,46,.08)}
.playlist-detail-table td{height:56px;padding:8px 10px;border-bottom:1px solid rgba(61,59,46,.055);vertical-align:middle}
.playlist-detail-table tbody tr{transition:background .14s ease}
.playlist-detail-table tbody tr:hover{background:rgba(27,28,24,.035)}
.playlist-detail-table tbody tr[draggable="true"]{cursor:grab}
.playlist-detail-table tbody tr.is-dragging{opacity:.32;background:rgba(27,28,24,.045)}
.playlist-detail-table tbody tr.drop-before{box-shadow:inset 0 2px 0 var(--primary,#d1633c)}
.playlist-detail-table tbody tr.drop-after{box-shadow:inset 0 -2px 0 var(--primary,#d1633c)}
.playlist-drag-card{position:fixed;left:-9999px;top:-9999px;z-index:9999;display:flex;align-items:center;gap:10px;width:190px;height:46px;padding:6px 12px;border:1px solid rgba(61,59,46,.1);border-radius:8px;background:color-mix(in srgb,var(--primary,#d1633c) 16%,#fff 84%);box-shadow:0 12px 28px rgba(27,28,24,.16);color:var(--sidebar-fg);pointer-events:none}
.playlist-drag-card-cover{width:34px;height:34px;border-radius:5px;overflow:hidden;display:grid;place-items:center;flex:0 0 34px;background:#ECE7D9;color:#676556}
.playlist-drag-card-cover img{width:100%;height:100%;object-fit:cover}
.playlist-drag-card-copy{min-width:0;display:flex;flex-direction:column;gap:2px}
.playlist-drag-card-title,.playlist-drag-card-artist{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.playlist-drag-card-title{font-size:13px;font-weight:750;line-height:1.1}
.playlist-drag-card-artist{font-size:11px;font-weight:600;color:var(--sidebar-muted)}
.track-index{width:44px;text-align:center!important;color:#8f8a7d}
.track-play-cell{position:relative;width:44px;text-align:center!important;color:#8f8a7d}
.track-number{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;color:#8f8a7d;font-weight:650}
.playlist-detail-table tbody tr .track-play-cell button.track-play-button{position:absolute;left:50%;top:50%;display:grid;width:34px;height:34px;padding:0!important;place-items:center;border:0!important;border-radius:0!important;background:none!important;background-color:transparent!important;box-shadow:none!important;color:#27364a!important;opacity:0;transform:translate(-50%,-50%) scale(.92);cursor:pointer;appearance:none;-webkit-appearance:none;transition:opacity .14s ease,transform .14s ease,color .14s ease,filter .14s ease}
.track-play-button svg{width:22px;height:22px;display:block;overflow:visible;filter:none;transition:filter .14s ease,transform .14s ease}
.track-pause-icon{display:none!important}
.track-play-button[data-state="pause"] .track-play-icon{display:none!important}
.track-play-button[data-state="pause"] .track-pause-icon{display:block!important}
.playlist-detail-table tbody tr:hover .track-number,.playlist-detail-table tbody tr:focus-within .track-number{opacity:0}
.playlist-detail-table tbody tr:hover .track-play-cell button.track-play-button,.playlist-detail-table tbody tr:focus-within .track-play-cell button.track-play-button{opacity:1!important;transform:translate(-50%,-50%) scale(1)}
.playlist-detail-table tbody tr.is-playing .track-number{opacity:0}
.playlist-detail-table tbody tr.is-playing .track-play-cell button.track-play-button{opacity:1!important;transform:translate(-50%,-50%) scale(1)}
.playlist-detail-table tbody tr .track-play-cell button.track-play-button:hover,.playlist-detail-table tbody tr .track-play-cell button.track-play-button:focus-visible{border-radius:0!important;background:none!important;background-color:transparent!important;box-shadow:none!important;color:#162236!important}
.track-play-button:hover svg,.track-play-button:focus-visible svg{filter:drop-shadow(0 4px 5px rgba(20,28,40,.34));transform:translateY(-1px)}
.track-title-cell{display:flex;align-items:center;gap:10px;min-width:0}
.track-cover{width:38px;height:38px;border-radius:6px;overflow:hidden;display:grid;place-items:center;background:#ECE7D9;color:#676556;flex:0 0 38px}
.track-cover img{width:100%;height:100%;object-fit:cover}
.track-main{min-width:0}
.track-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sidebar-fg);font-weight:750}
.track-artist{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;color:var(--sidebar-muted);font-size:11px;font-weight:600}
.track-album{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#6f6a5f}
.track-like{width:62px;text-align:center!important;color:#ff4761}
.track-duration{width:74px;color:#8f8a7d}

.material-symbols-outlined {
  font-family: 'Material Symbols Outlined' !important;
  font-weight: 400;
  font-style: normal;
  font-size: 24px;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  direction: ltr;
  -webkit-font-smoothing: antialiased;
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
}

/* Mobile */
@media (max-width: 767px) {
  .music-sidebar-group { display: block; }
  .music-sidebar-spacer { display: none; }
  .music-sidebar-panel {
    box-shadow: 8px 0 30px rgba(0,0,0,.18);
  }
  .music-trigger { margin: 12px 0 0 8px; }
  .music-main-body{padding:22px 18px 38px}
  .music-view-header{align-items:flex-start;flex-direction:column}
  .local-playlist-card{max-width:none}.local-playlist-list{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.playlist-tilted-card{height:210px}.playlist-card-info{left:18px;top:18px;max-width:calc(100% - 36px)}.playlist-detail-hero{grid-template-columns:112px minmax(0,1fr);gap:16px}.playlist-detail-cover{width:112px;height:112px}.playlist-detail-title{font-size:22px}.playlist-detail-tabs{align-items:flex-start;flex-direction:column}.playlist-input-group{width:100%}.playlist-input-group input{width:100%}.playlist-detail-table th:nth-child(3),.playlist-detail-table td:nth-child(3){display:none}
}
</style>

<body class="font-body-md text-body-md overflow-hidden" data-page="music">

<div class="music-root">

  <div class="music-sidebar-group" id="sidebarGroup" data-state="expanded" data-collapsible="offcanvas">
    <div class="music-sidebar-spacer"></div>
    <div class="music-sidebar-panel">
      <div class="music-sidebar">
        <div class="music-sidebar-header">
          <div class="music-sidebar-brand"><span class="material-symbols-outlined">queue_music</span> Music</div>
        </div>

        <div class="music-sidebar-content">
          <div class="music-group-label">Source</div>

          <!-- Local with submenu -->
          <div class="music-submenu" data-state="open">
            <button class="music-item music-submenu-trigger" data-source="local" aria-checked="true" aria-expanded="true">
              <span class="material-symbols-outlined">folder</span>
              <span>Local</span>
              <span class="music-submenu-chevron">&#8250;</span>
            </button>
            <div class="music-submenu-list">
              <button class="music-item music-sub-item" data-view="playlist" aria-checked="true">
                <span class="material-symbols-outlined">queue_music</span>
                <span>Playlist</span>
              </button>
              <button class="music-item music-sub-item" data-view="history" aria-checked="false">
                <span class="material-symbols-outlined">history</span>
                <span>History</span>
              </button>
            </div>
          </div>

          <button class="music-item" data-source="netease" aria-checked="false">
            <span class="material-symbols-outlined">cloud</span>
            <span>NetEase Cloud</span>
          </button>
        </div>

        <div class="music-sidebar-footer"></div>
      </div>
      <div class="music-sidebar-rail"></div>
    </div>
  </div>

  <main class="music-main">
    <button class="music-trigger" id="sidebarTrigger" title="Toggle Sidebar">&#9776;</button>
    <div class="music-main-body">
      <section class="music-view" data-music-view="playlist">
        <header class="music-view-header">
          <div>
            <h1 class="music-view-title">Local Playlist</h1>
            <p class="music-view-subtitle">Import local playlist folders and display them as cards.</p>
          </div>
          <button class="music-import-button" id="importLocalPlaylist" type="button">
            <span class="material-symbols-outlined">library_add</span>
            <span>Import Playlist Folder</span>
          </button>
        </header>
        <div class="local-playlist-card">
          <div class="local-playlist-list" id="localPlaylistList"></div>
        </div>
        <p class="music-status-line" id="localPlaylistStatus" role="status"></p>
      </section>

      <section class="music-view" data-music-view="history" hidden>
        <div class="music-placeholder">
          <span class="material-symbols-outlined" style="font-size:48px;opacity:.35;width:auto">history</span>
          <h2>History</h2>
          <p></p>
        </div>
      </section>

      <section class="music-view playlist-detail" data-music-view="playlist-detail" hidden>
        <button class="playlist-detail-back" id="playlistDetailBack" type="button"><span class="material-symbols-outlined">arrow_back</span><span>Back</span></button>
        <div id="playlistDetailContent"></div>
      </section>

      <section class="music-view" data-music-view="netease" hidden>
        <div class="music-placeholder">
          <span class="material-symbols-outlined" style="font-size:48px;opacity:.35;width:auto">cloud</span>
          <h2>NetEase Cloud</h2>
          <p></p>
        </div>
      </section>

      <section class="music-view" data-music-view="empty" hidden>
        <div class="music-placeholder">
        <span class="material-symbols-outlined" style="font-size:48px;opacity:.35;width:auto">headphones</span>
        <h2>Ready to play</h2>
        <p>Select a source to start listening.</p>
        </div>
      </section>
    </div>
  </main>

</div>

<script>
const group = document.getElementById('sidebarGroup');
const trigger = document.getElementById('sidebarTrigger');
const localPlaylistList = document.getElementById('localPlaylistList');
const localPlaylistStatus = document.getElementById('localPlaylistStatus');
const importLocalPlaylist = document.getElementById('importLocalPlaylist');
const playlistDetailBack = document.getElementById('playlistDetailBack');
const playlistDetailContent = document.getElementById('playlistDetailContent');
const KEY = 'kairos-music-sidebar';
const PLAYLIST_ORDER_KEY = 'kairos-music-playlist-orders';
  const kairosConfirmAlert=({title:t,description:d,action='Delete',cancel='Cancel'}={})=>new Promise(resolve=>{
    let dialog=document.getElementById('kairosAlertDialog');
    if(!dialog){dialog=document.createElement('dialog');dialog.id='kairosAlertDialog';dialog.className='kairos-alert-dialog';dialog.setAttribute('role','alertdialog');dialog.innerHTML='<form method="dialog" class="kairos-alert-content"><div class="kairos-alert-header"><div class="kairos-alert-media"><span class="material-symbols-outlined">warning</span></div><div><h2 class="kairos-alert-title"></h2><p class="kairos-alert-description"></p></div></div><footer class="kairos-alert-footer"><button class="kairos-alert-cancel" value="cancel" type="submit"></button><button class="kairos-alert-action" value="confirm" type="submit"></button></footer></form>';document.body.append(dialog)}
    dialog.querySelector('.kairos-alert-title').textContent=t||'Are you sure?';dialog.querySelector('.kairos-alert-description').textContent=d||'This action cannot be undone.';dialog.querySelector('.kairos-alert-cancel').textContent=cancel;dialog.querySelector('.kairos-alert-action').textContent=action;
    const done=value=>{dialog.removeEventListener('close',onClose);resolve(value)};const onClose=()=>done(dialog.returnValue==='confirm');
    dialog.addEventListener('close',onClose,{once:true});dialog.showModal();dialog.querySelector('.kairos-alert-cancel')?.focus();
  });

let musicState = { tracks: [] };
let currentPlaylistId = null;
let musicSyncing = false;
let musicStateSignature = "";
let playbackState = { currentTrackId: null, playing: false };
let syncVisiblePlaylistPlayback = () => {};
const getDesktopMusic = () => {
  if (window.kairosDesktop?.music) return window.kairosDesktop.music;
  try {
    return window.parent?.kairosDesktop?.music || null;
  } catch {
    return null;
  }
};

const notifyMusicPlayer = (detail = {}) => {
  const payload = { source: location.href, at: Date.now(), refresh: true, ...detail };
  try { window.dispatchEvent(new CustomEvent('kairos:music-refresh', { detail: payload })); } catch {}
  if (window.parent && window.parent !== window) {
    try { window.parent.dispatchEvent(new CustomEvent('kairos:music-refresh', { detail: payload })); } catch {}
  }
};

const showMusicView = view => {
  document.querySelectorAll('[data-music-view]').forEach(section => {
    section.hidden = section.dataset.musicView !== view;
  });
};

const attachTiltedCard = card => {
  const inner = card.querySelector('.playlist-tilted-inner');
  const amplitude = 9;
  card.addEventListener('pointermove', event => {
    const rect = card.getBoundingClientRect();
    const offsetX = event.clientX - rect.left - rect.width / 2;
    const offsetY = event.clientY - rect.top - rect.height / 2;
    const rotateX = (offsetY / (rect.height / 2)) * -amplitude;
    const rotateY = (offsetX / (rect.width / 2)) * amplitude;
    inner.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.035)`;
  });
  card.addEventListener('pointerleave', () => {
    inner.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
  });
};

const formatTrackDuration = seconds => {
  if (!Number.isFinite(seconds) || seconds <= 0) return '--:--';
  const minutes = Math.floor(seconds / 60);
  return `${minutes}:${String(Math.floor(seconds % 60)).padStart(2, '0')}`;
};

const hydrateTrackDuration = (track, cell) => {
  if (!track || Number.isFinite(track.duration) && track.duration > 0 || !track.playUrl || !cell) return;
  const audio = new Audio();
  audio.preload = 'metadata';
  audio.src = track.playUrl;
  audio.onloadedmetadata = async () => {
    const duration = audio.duration;
    if (!Number.isFinite(duration) || duration <= 0) return;
    track.duration = duration;
    cell.textContent = formatTrackDuration(duration);
    const desktopMusic = getDesktopMusic();
    if (desktopMusic?.updateTrack) {
      try { musicState = await desktopMusic.updateTrack({ id: track.id, duration }); } catch {}
    }
  };
  audio.onerror = () => {};
};

const cleanMusicText = value => String(value || '').split('').filter(ch => { const code = ch.charCodeAt(0); return code >= 32 && code !== 127 && code !== 65533 && code !== 9633 && code !== 9647; }).join('').trim();

const applyPlaybackState = detail => {
  if (!detail?.currentTrackId) {
    playbackState = { currentTrackId: null, playing: false };
    syncVisiblePlaylistPlayback();
    return;
  }
  playbackState = { currentTrackId: detail.currentTrackId, playing: detail.playing === true };
  syncVisiblePlaylistPlayback();
};

window.addEventListener('kairos:music-state-changed', event => applyPlaybackState(event.detail));
window.addEventListener('message', event => {
  if (event.data?.type === 'kairos:music-state-changed') applyPlaybackState(event.data.detail);
});

const getMusicStateSignature = state => JSON.stringify({
  tracks: (state.tracks || []).map(track => [track.id, track.path, track.fileSize, track.updatedAt]),
  playlists: (state.playlists || []).map(playlist => [playlist.id, playlist.folderPath, playlist.trackIds])
});

const readPlaylistOrders = () => {
  try { return JSON.parse(localStorage.getItem(PLAYLIST_ORDER_KEY) || '{}') || {}; }
  catch { return {}; }
};

const playlistOrderKey = playlist => playlist?.id || playlist?.folderPath || playlist?.name || 'playlist';

const savePlaylistOrder = (playlist, trackIds) => {
  const orders = readPlaylistOrders();
  orders[playlistOrderKey(playlist)] = trackIds;
  if (playlist?.folderPath) orders[playlist.folderPath] = trackIds;
  localStorage.setItem(PLAYLIST_ORDER_KEY, JSON.stringify(orders));
};

const removeSavedPlaylistOrder = playlist => {
  const orders = readPlaylistOrders();
  delete orders[playlistOrderKey(playlist)];
  if (playlist?.folderPath) delete orders[playlist.folderPath];
  localStorage.setItem(PLAYLIST_ORDER_KEY, JSON.stringify(orders));
};

const orderPlaylistTrackIds = playlist => {
  const ids = Array.isArray(playlist?.trackIds) ? playlist.trackIds : [];
  const orders = readPlaylistOrders();
  const saved = orders[playlistOrderKey(playlist)] || orders[playlist?.folderPath];
  if (!Array.isArray(saved) || !saved.length) return ids;
  const valid = new Set(ids);
  return [...saved.filter(id => valid.has(id)), ...ids.filter(id => !saved.includes(id))];
};

const applySavedPlaylistOrders = state => ({
  ...state,
  playlists: (state.playlists || []).map(playlist => ({
    ...playlist,
    trackIds: orderPlaylistTrackIds(playlist)
  }))
});

const getPlaylistModel = playlistId => {
  const tracks = Array.isArray(musicState.tracks) ? musicState.tracks : [];
  const playlists = Array.isArray(musicState.playlists) ? musicState.playlists : [];
  const playlist = playlists.find(item => item.id === playlistId) || playlists[0];
  if (!playlist) return null;
  const byId = new Map(tracks.map(track => [track.id, track]));
  const orderedTrackIds = orderPlaylistTrackIds(playlist);
  const orderedPlaylist = { ...playlist, trackIds: orderedTrackIds };
  const playlistTracks = orderedTrackIds.map(id => byId.get(id)).filter(Boolean);
  return { playlist: orderedPlaylist, tracks: playlistTracks };
};

const playlistDisplayCover = (playlist, firstTrack) => firstTrack?.coverUrl || playlist?.coverUrl || '';

const renderCoverNode = (container, coverUrl, fallbackClass = '') => {
  container.replaceChildren();
  if (coverUrl) {
    const img = document.createElement('img');
    img.alt = '';
    img.src = coverUrl;
    container.append(img);
    return;
  }
  if (fallbackClass === 'playlist-card') {
    container.innerHTML = '<span class="playlist-card-cover-placeholder"><span class="material-symbols-outlined">album</span></span>';
  } else {
    container.innerHTML = '<div class="playlist-detail-cover-placeholder"><span class="material-symbols-outlined">album</span></div>';
  }
};

const syncPlaylistCardCover = (playlist, tracks) => {
  const card = localPlaylistList.querySelector(`.playlist-tilted-card[data-playlist-id="${CSS.escape(playlist.id)}"]`);
  const cover = card?.querySelector('.playlist-card-cover');
  if (!cover) return;
  renderCoverNode(cover, playlistDisplayCover(playlist, tracks?.[0]), 'playlist-card');
};

const deletePlaylist = async (playlist, triggerButton = null) => {
  if (!playlist?.id) return;
  const title = playlist.name || 'Local Playlist';
  const ok = await kairosConfirmAlert({
    title: 'Delete playlist?',
    description: `${title} will be removed from your library.`,
    action: 'Delete',
    cancel: 'Cancel'
  });
  if (!ok) return;
  const desktopMusic = getDesktopMusic();
  if (!desktopMusic?.removePlaylist) {
    localPlaylistStatus.textContent = 'Delete is unavailable in this view.';
    return;
  }
  if (triggerButton) triggerButton.disabled = true;
  try {
    removeSavedPlaylistOrder(playlist);
    musicState = applySavedPlaylistOrders(await desktopMusic.removePlaylist(playlist.id));
    if (currentPlaylistId === playlist.id) {
      currentPlaylistId = null;
      showMusicView('playlist');
    }
    renderLocalPlaylist();
    notifyMusicPlayer({ queueTrackIds: musicState.queueTrackIds || [], currentTrackId: musicState.currentTrackId || null, playing: false });
  } catch (error) {
    console.error('removePlaylist failed', error);
    localPlaylistStatus.textContent = 'Delete failed. Please try again.';
  } finally {
    if (triggerButton) triggerButton.disabled = false;
  }
};

const renderPlaylistDetail = playlistId => {
  const model = getPlaylistModel(playlistId);
  playlistDetailContent.replaceChildren();
  if (!model) {
    playlistDetailContent.innerHTML = '<div class="music-placeholder"><h2>Playlist not found</h2><p></p></div>';
    return;
  }
  currentPlaylistId = model.playlist.id;
  const firstTrack = model.tracks[0];
  const coverUrl = playlistDisplayCover(model.playlist, firstTrack);
  const title = model.playlist.name || 'Local Playlist';
  const hero = document.createElement('div');
  hero.className = 'playlist-detail-hero';
  hero.innerHTML = `
    <div class="playlist-detail-cover"></div>
    <div>
      <p class="playlist-detail-kicker">Playlist</p>
      <h1 class="playlist-detail-title"></h1>
      <p class="playlist-detail-meta"></p>
      <div class="playlist-detail-actions">
        <button class="playlist-play-all" type="button"><span class="material-symbols-outlined">play_arrow</span><span>Play All</span></button>
        <button class="playlist-delete" id="playlistDeleteBtn" type="button"><span class="material-symbols-outlined">delete</span><span>Delete Playlist</span></button>
      </div>
    </div>
  `;
  const cover = hero.querySelector('.playlist-detail-cover');
  renderCoverNode(cover, coverUrl);
  hero.querySelector('.playlist-detail-title').textContent = title;
  hero.querySelector('.playlist-detail-meta').textContent = `${model.tracks.length} track${model.tracks.length === 1 ? '' : 's'} ${model.playlist.folderPath ? `\u00b7 ${model.playlist.folderPath}` : ''}`;
  const updateTrackPlaybackRows = () => {
    tbody?.querySelectorAll('tr[data-track-id]').forEach(row => {
      const isActive = row.dataset.trackId === playbackState.currentTrackId && playbackState.playing;
      row.classList.toggle('is-playing', isActive);
      const button = row.querySelector('.track-play-button');
      if (button) {
        button.dataset.state = isActive ? 'pause' : 'play';
        button.setAttribute('aria-label', isActive ? 'Pause track' : 'Play track');
      }
    });
  };
  const playPlaylistTrack = async (trackId, options = {}) => {
    const target = model.tracks.find(track => track.id === trackId);
    const desktopMusic = getDesktopMusic();
    if (!target) return;
    if (playbackState.currentTrackId === target.id && playbackState.playing) {
      playbackState = { currentTrackId: target.id, playing: false };
      if (desktopMusic?.updatePlayback) {
        try { musicState = await desktopMusic.updatePlayback({ currentTrackId: target.id, playing: false }); } catch (error) { console.error('updatePlayback failed', error); }
      }
      notifyMusicPlayer({ currentTrackId: target.id, playing: false });
      updateTrackPlaybackRows();
      return;
    }
    const queueTrackIds = model.tracks.map(track => track.id);
    const playbackPatch = {
      queueTrackIds,
      currentTrackId: target.id,
      playing: true,
      ...(options.forceSequence ? { mode: 'sequence' } : {})
    };
    musicState = {
      ...musicState,
      queueTrackIds,
      currentTrackId: target.id,
      playing: true,
      ...(options.forceSequence ? { mode: 'sequence' } : {})
    };
    if (desktopMusic) {
      try {
        musicState = await desktopMusic.updatePlayback(playbackPatch);
      } catch (error) {
        console.error('updatePlayback failed', error);
      }
    }
    playbackState = { currentTrackId: target.id, playing: true };
    updateTrackPlaybackRows();
    notifyMusicPlayer({ queueTrackIds, currentTrackId: target.id, playing: true, ...(options.forceSequence ? { mode: 'sequence' } : {}) });
  };
  hero.querySelector('.playlist-play-all').addEventListener('click', async () => {
    const first = model.tracks[0];
    if (first) await playPlaylistTrack(first.id, { forceSequence: true });
  });

  const deleteBtn = hero.querySelector('.playlist-delete');
  if (deleteBtn) {
    deleteBtn.addEventListener('click', event => {
      event.preventDefault();
      event.stopPropagation();
      deletePlaylist(model.playlist, deleteBtn);
    });
  }

  const tabs = document.createElement('div');
  tabs.className = 'playlist-detail-tabs';
  tabs.innerHTML = `
    <div class="playlist-detail-tab">Songs <sup>${model.tracks.length}</sup></div>
    <label class="playlist-input-group">
      <span class="playlist-input-addon"><span class="material-symbols-outlined">search</span></span>
      <input id="playlistDetailSearch" type="search" placeholder="Search">
      <span class="playlist-input-results" id="playlistSearchResults">${model.tracks.length} results</span>
    </label>
  `;

  const table = document.createElement('table');
  table.className = 'playlist-detail-table';
  table.innerHTML = `
    <thead><tr><th class="track-index">#</th><th>Title</th><th>Album</th><th class="track-like">Like</th><th class="track-duration">Time</th></tr></thead>
    <tbody></tbody>
  `;
  const tbody = table.querySelector('tbody');
  const resultsLabel = tabs.querySelector('#playlistSearchResults');
  let draggedTrackId = null;
  let dragCard = null;
  const clearDropHints = () => tbody.querySelectorAll('.drop-before,.drop-after').forEach(row => row.classList.remove('drop-before', 'drop-after'));
  const makeDragCard = track => {
    const card = document.createElement('div');
    card.className = 'playlist-drag-card';
    const cover = document.createElement('span');
    cover.className = 'playlist-drag-card-cover';
    if (track?.coverUrl) {
      const img = document.createElement('img');
      img.alt = '';
      img.src = track.coverUrl;
      cover.append(img);
    } else {
      cover.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px">music_note</span>';
    }
    const copy = document.createElement('span');
    copy.className = 'playlist-drag-card-copy';
    const name = document.createElement('span');
    name.className = 'playlist-drag-card-title';
    name.textContent = cleanMusicText(track?.title) || cleanMusicText(track?.fileName) || 'Untitled';
    const artist = document.createElement('span');
    artist.className = 'playlist-drag-card-artist';
    artist.textContent = cleanMusicText(track?.artist) || 'Local music';
    copy.append(name, artist);
    card.append(cover, copy);
    document.body.append(card);
    return card;
  };
  const persistPlaylistOrder = async () => {
    const visibleIds = [...tbody.querySelectorAll('tr[data-track-id]')].map(row => row.dataset.trackId);
    if (!visibleIds.length) return;
    const currentIds = model.tracks.map(track => track.id);
    const visibleSet = new Set(visibleIds);
    const nextIds = [...visibleIds, ...currentIds.filter(id => !visibleSet.has(id))];
    const byId = new Map(model.tracks.map(track => [track.id, track]));
    model.playlist.trackIds = nextIds;
    model.tracks = nextIds.map(id => byId.get(id)).filter(Boolean);
    savePlaylistOrder(model.playlist, nextIds);
    const statePlaylist = musicState.playlists?.find(playlist => playlist.id === model.playlist.id);
    if (statePlaylist) statePlaylist.trackIds = nextIds;
    renderCoverNode(cover, playlistDisplayCover(model.playlist, model.tracks[0]));
    syncPlaylistCardCover(model.playlist, model.tracks);
    const desktopMusic = getDesktopMusic();
    if (desktopMusic?.reorderPlaylist) {
      try {
        musicState = applySavedPlaylistOrders(await desktopMusic.reorderPlaylist(model.playlist.id, nextIds));
      } catch (error) {
        console.error('reorderPlaylist failed', error);
      }
    } else if (desktopMusic?.reorder) {
      try {
        musicState = applySavedPlaylistOrders(await desktopMusic.reorder(nextIds));
      } catch (error) {
        console.error('reorder fallback failed', error);
      }
    }
    notifyMusicPlayer();
  };
  const renderRows = query => {
    tbody.replaceChildren();
    const normalized = (query || '').trim().toLowerCase();
    const filtered = model.tracks
      .filter(track => !normalized || `${track.title || ''} ${track.artist || ''} ${track.album || ''}`.toLowerCase().includes(normalized))
    resultsLabel.textContent = `${filtered.length} result${filtered.length === 1 ? '' : 's'}`;
    filtered.forEach((track, index) => {
        const row = document.createElement('tr');
        row.dataset.trackId = track.id;
        row.draggable = true;
        row.innerHTML = `
          <td class="track-play-cell"><span class="track-number">${String(index + 1).padStart(2, '0')}</span><button class="track-play-button send" type="button" aria-label="Play track" data-state="play"><svg class="track-play-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M8.75 6.45c0-1.18 1.29-1.9 2.29-1.28l8.22 5.14c.94.59.94 1.96 0 2.55L11.04 18c-1 .62-2.29-.1-2.29-1.28V6.45Z" fill="currentColor"/></svg><svg class="track-pause-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M7.4 5.2h3.2c.66 0 1.2.54 1.2 1.2v11.2c0 .66-.54 1.2-1.2 1.2H7.4c-.66 0-1.2-.54-1.2-1.2V6.4c0-.66.54-1.2 1.2-1.2Zm6 0h3.2c.66 0 1.2.54 1.2 1.2v11.2c0 .66-.54 1.2-1.2 1.2h-3.2c-.66 0-1.2-.54-1.2-1.2V6.4c0-.66.54-1.2 1.2-1.2Z" fill="currentColor"/></svg></button></td>
          <td><div class="track-title-cell"><span class="track-cover"></span><span class="track-main"><span class="track-name"></span><span class="track-artist"></span></span></div></td>
          <td class="track-album"></td>
          <td class="track-like"><span class="material-symbols-outlined">favorite</span></td>
          <td class="track-duration"></td>
        `;
        const trackCover = row.querySelector('.track-cover');
        if (track.coverUrl) {
          const img = document.createElement('img');
          img.alt = '';
          img.src = track.coverUrl;
          trackCover.append(img);
        } else {
          trackCover.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px">music_note</span>';
        }
        row.querySelector('.track-name').textContent = cleanMusicText(track.title) || cleanMusicText(track.fileName) || 'Untitled';
        row.querySelector('.track-artist').textContent = cleanMusicText(track.artist) || 'Local music';
        row.querySelector('.track-album').textContent = cleanMusicText(track.album) || title;
        const durationCell = row.querySelector('.track-duration');
        durationCell.textContent = formatTrackDuration(track.duration);
        hydrateTrackDuration(track, durationCell);
        tbody.append(row);
      });
    updateTrackPlaybackRows();
  };
  playlistDetailContent.append(hero, tabs, table);
  syncVisiblePlaylistPlayback = updateTrackPlaybackRows;
  tbody.addEventListener('click', event => {
    const button = event.target.closest('.track-play-button');
    if (!button) return;
    event.preventDefault();
    event.stopPropagation();
    const row = button.closest('tr[data-track-id]');
    if (row?.dataset.trackId) playPlaylistTrack(row.dataset.trackId);
  });
  tbody.addEventListener('dragstart', event => {
    const row = event.target.closest('tr[data-track-id]');
    if (!row || event.target.closest('button, input, a')) {
      event.preventDefault();
      return;
    }
    draggedTrackId = row.dataset.trackId;
    row.classList.add('is-dragging');
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', draggedTrackId);
    dragCard?.remove();
    dragCard = makeDragCard(model.tracks.find(track => track.id === draggedTrackId));
    event.dataTransfer.setDragImage(dragCard, 24, 23);
  });
  tbody.addEventListener('dragover', event => {
    const row = event.target.closest('tr[data-track-id]');
    if (!row || !draggedTrackId || row.dataset.trackId === draggedTrackId) return;
    event.preventDefault();
    const dragged = tbody.querySelector(`tr[data-track-id="${CSS.escape(draggedTrackId)}"]`);
    if (!dragged) return;
    const rect = row.getBoundingClientRect();
    const after = event.clientY > rect.top + rect.height / 2;
    clearDropHints();
    row.classList.add(after ? 'drop-after' : 'drop-before');
    tbody.insertBefore(dragged, after ? row.nextSibling : row);
  });
  tbody.addEventListener('dragleave', event => {
    event.target.closest('tr[data-track-id]')?.classList.remove('drop-before', 'drop-after');
  });
  tbody.addEventListener('dragend', async () => {
    tbody.querySelectorAll('.is-dragging,.drop-before,.drop-after').forEach(row => row.classList.remove('is-dragging', 'drop-before', 'drop-after'));
    dragCard?.remove();
    dragCard = null;
    const hadDrag = Boolean(draggedTrackId);
    draggedTrackId = null;
    if (hadDrag) await persistPlaylistOrder();
  });
  renderRows('');
  playlistDetailContent.querySelector('#playlistDetailSearch')?.addEventListener('input', event => renderRows(event.target.value));
};

const renderLocalPlaylist = () => {
  localPlaylistList.replaceChildren();
  const tracks = Array.isArray(musicState.tracks) ? musicState.tracks : [];
  const playlists = Array.isArray(musicState.playlists) ? musicState.playlists : [];
  if (!playlists.length) {
    const empty = document.createElement('div');
    empty.className = 'local-playlist-empty';
    empty.textContent = 'No local playlist folder imported yet.';
    localPlaylistList.append(empty);
    localPlaylistStatus.textContent = '0 playlists';
    return;
  }

  const byId = new Map(tracks.map(track => [track.id, track]));
  playlists.forEach(playlist => {
    const playlistTracks = orderPlaylistTrackIds(playlist).map(id => byId.get(id)).filter(Boolean);
    const firstTrack = playlistTracks[0];
    const card = document.createElement('div');
    card.className = 'playlist-tilted-card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `Open ${playlist.name || 'Local Playlist'}`);
    const openPlaylistDetail = () => {
      renderPlaylistDetail(playlist.id);
      showMusicView('playlist-detail');
    };
    card.addEventListener('click', event => {
      event.stopPropagation();
      openPlaylistDetail();
    });
    card.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      openPlaylistDetail();
    });
    card.innerHTML = `
      <span class="playlist-tilted-inner">
        <span class="playlist-card-cover"></span>
        <span class="playlist-card-overlay"></span>
        <span class="playlist-card-badge"><span class="material-symbols-outlined" style="font-size:16px;width:16px">queue_music</span>${playlistTracks.length}</span>
        <span class="playlist-card-info">
          <span class="playlist-card-title"></span>
          <span class="playlist-card-meta"></span>
        </span>
      </span>
    `;
    const cover = card.querySelector('.playlist-card-cover');
    const coverUrl = playlistDisplayCover(playlist, firstTrack);
    renderCoverNode(cover, coverUrl, 'playlist-card');
    const title = playlist.name || 'Local Playlist';
    card.querySelector('.playlist-card-title').textContent = title;
    card.querySelector('.playlist-card-meta').textContent = `${playlistTracks.length} track${playlistTracks.length === 1 ? '' : 's'} ${firstTrack ? `\u00b7 ${cleanMusicText(firstTrack.title) || cleanMusicText(firstTrack.fileName) || 'Untitled'}` : ''}`;
    card.dataset.playlistId = playlist.id;
    attachTiltedCard(card);
    localPlaylistList.append(card);
  });
  localPlaylistStatus.textContent = `${playlists.length} playlist${playlists.length === 1 ? '' : 's'} \u00b7 ${tracks.length} track${tracks.length === 1 ? '' : 's'}`;
  // Delegated click bypasses 3D transform interference
  localPlaylistList.onclick = event => {
    const card = event.target.closest('.playlist-tilted-card');
    if (!card || !card.dataset.playlistId) return;
    renderPlaylistDetail(card.dataset.playlistId);
    showMusicView('playlist-detail');
  };
};

const refreshMusicState = async ({ forceRender = true } = {}) => {
  if (musicSyncing) return;
  musicSyncing = true;
  const desktopMusic = getDesktopMusic();
  try {
    if (!desktopMusic) {
      if (forceRender) renderLocalPlaylist();
      return;
    }
    let nextState;
    try {
      nextState = desktopMusic.syncFolders ? await desktopMusic.syncFolders() : await desktopMusic.getState();
    } catch (error) {
      console.warn('syncFolders failed, falling back to getState', error);
      nextState = await desktopMusic.getState();
    }
    const nextSignature = getMusicStateSignature(nextState);
    const changed = nextSignature !== musicStateSignature;
    musicState = applySavedPlaylistOrders(nextState);
    playbackState = { currentTrackId: musicState.currentTrackId || null, playing: musicState.playing === true };
    musicStateSignature = nextSignature;
    if (forceRender || changed) {
      if (currentPlaylistId && !document.querySelector('[data-music-view="playlist-detail"]')?.hidden) {
        renderPlaylistDetail(currentPlaylistId);
      } else {
        renderLocalPlaylist();
      }
    }
  } catch (error) {
    console.error('refreshMusicState failed', error);
    if (forceRender) {
      renderLocalPlaylist();
      localPlaylistStatus.textContent = 'Unable to load local playlists. Retrying...';
      setTimeout(() => refreshMusicState({ forceRender: true }), 600);
    }
  } finally {
    musicSyncing = false;
  }
};

importLocalPlaylist.addEventListener('click', async () => {
  const desktopMusic = getDesktopMusic();
  if (!desktopMusic) {
    localPlaylistStatus.textContent = 'Desktop music import is unavailable in this view.';
    return;
  }
  localPlaylistStatus.textContent = 'Opening folder picker...';
  const result = await desktopMusic.chooseFolder();
  musicState = applySavedPlaylistOrders(result.state || result);
  musicStateSignature = getMusicStateSignature(musicState);
  renderLocalPlaylist();
  if (result.rejected?.length) {
    localPlaylistStatus.textContent = `${result.imported?.length || 0} imported, ${result.rejected.length} skipped`;
  }
});

playlistDetailBack.addEventListener('click', () => {
  showMusicView('playlist');
});

trigger.addEventListener('click', () => {
  const next = group.dataset.state === 'expanded' ? 'collapsed' : 'expanded';
  group.dataset.state = next;
  localStorage.setItem(KEY, next);
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'b') {
    e.preventDefault();
    trigger.click();
  }
});

const saved = localStorage.getItem(KEY);
if (saved) group.dataset.state = saved;

// Submenu toggle
document.querySelectorAll('.music-submenu-trigger').forEach(trigger => {
  trigger.addEventListener('click', () => {
    const submenu = trigger.closest('.music-submenu');
    const next = submenu.dataset.state === 'open' ? 'closed' : 'open';
    submenu.dataset.state = next;
    trigger.setAttribute('aria-expanded', String(next === 'open'));
  });
});

// Sub-item selection
document.querySelectorAll('.music-sub-item').forEach(button => {
  button.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.music-sub-item').forEach(item =>
      item.setAttribute('aria-checked', 'false')
    );
    button.setAttribute('aria-checked', 'true');
    document.querySelectorAll('[data-source]').forEach(item =>
      item.setAttribute('aria-checked', String(item.dataset.source === 'local'))
    );
    showMusicView(button.dataset.view || 'playlist');
  });
});

// Source toggle (NetEase Cloud)
document.querySelectorAll('[data-source]').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('[data-source]').forEach(item =>
      item.setAttribute('aria-checked', String(item === button))
    );
    if (button.dataset.source === 'netease') {
      document.querySelectorAll('.music-sub-item').forEach(item => item.setAttribute('aria-checked', 'false'));
      showMusicView('netease');
    } else {
      showMusicView('playlist');
      document.querySelector('[data-view="playlist"]')?.setAttribute('aria-checked', 'true');
    }
  });
});
showMusicView('playlist');
refreshMusicState().finally(() => {
  try {
    window.dispatchEvent(new CustomEvent('kairos:music-content-ready'));
    if (window.parent && window.parent !== window) window.parent.dispatchEvent(new CustomEvent('kairos:music-content-ready'));
  } catch {}
});
window.addEventListener('focus', () => refreshMusicState({ forceRender: false }));
setInterval(() => refreshMusicState({ forceRender: false }), 30000);
</script>
